<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
      label { display: block; margin-top: 12px; font-weight: bold; }
      input[type="text"], input[type="file"] { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
      button { margin-top: 20px; padding: 10px 18px; cursor: pointer; }
      #status { margin-top: 16px; font-weight: bold; }
      #status.error { color: #b00020; }
      #status.success { color: #1a7f37; }
      .hint { font-weight: normal; font-size: 0.85em; color: #666; }
    </style>
  </head>
  <body>
    <h2>Submit a Taskipelago YAML</h2>
    <form id="submitForm">
      <label>Slot Name <span class="hint">(letters/numbers/hyphens only, no spaces)</span>
        <input type="text" id="slotName" required>
      </label>
      <label>Author Name <span class="hint">(letters/numbers/hyphens only, no spaces)</span>
        <input type="text" id="authorName" required>
      </label>
      <label>Taskipelago Version <span class="hint">(e.g. 1.0.0)</span>
        <input type="text" id="version" placeholder="1.0.0" required>
      </label>
      <label>YAML File
        <input type="file" id="yamlFile" accept=".yaml,.yml" required>
      </label>
      <button type="submit" id="submitBtn">Submit</button>
    </form>
    <div id="status"></div>

    <script>
      var NAME_PATTERN = /^[A-Za-z0-9-]+$/;
      var VERSION_PATTERN = /^\d+\.\d+\.\d+$/;

      document.getElementById('submitForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var slotName = document.getElementById('slotName').value.trim();
        var authorName = document.getElementById('authorName').value.trim();
        var version = document.getElementById('version').value.trim();
        var fileInput = document.getElementById('yamlFile');
        var statusEl = document.getElementById('status');
        var submitBtn = document.getElementById('submitBtn');

        statusEl.className = '';
        statusEl.textContent = '';

        if (!NAME_PATTERN.test(slotName)) {
          return showError('Slot name may only contain letters, numbers, and hyphens.');
        }
        if (!NAME_PATTERN.test(authorName)) {
          return showError('Author name may only contain letters, numbers, and hyphens.');
        }
        if (!VERSION_PATTERN.test(version)) {
          return showError('Version must look like 1.0.0');
        }
        if (!fileInput.files.length) {
          return showError('Please choose a YAML file.');
        }

        var file = fileInput.files[0];
        var reader = new FileReader();
        reader.onload = function () {
          var base64Data = reader.result.split(',')[1];
          submitBtn.disabled = true;
          submitBtn.textContent = 'Submitting...';
          google.script.run
            .withSuccessHandler(function (fileName) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit';
              statusEl.className = 'success';
              statusEl.textContent = 'Submitted as ' + fileName;
              document.getElementById('submitForm').reset();
            })
            .withFailureHandler(function (err) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit';
              showError(err.message || String(err));
            })
            .submitYaml(slotName, authorName, version, base64Data, file.name);
        };
        reader.onerror = function () {
          showError('Could not read the selected file.');
        };
        reader.readAsDataURL(file);

        function showError(msg) {
          statusEl.className = 'error';
          statusEl.textContent = msg;
        }
      });
    </script>
  </body>
</html>
